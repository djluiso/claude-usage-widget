name: Release

# Push a tag like v1.2.3 to build the installers and publish a GitHub Release.
# Run manually (workflow_dispatch) to just build them as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -ne $cargo) { throw "Tag v$v does not match Cargo.toml version $cargo" }
          } else { $v = $cargo }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: cargo build --release --locked

      - name: Build setup.exe (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\setup.iss

      - name: Build .msi (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer\widget.wxs -arch x64 -d "Version=${{ steps.version.outputs.version }}" `
            -o "dist\ClaudeUsageWidget-${{ steps.version.outputs.version }}.msi"
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue

      - name: Portable zip + checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path target\release\claude-usage-widget.exe, README.md `
            -DestinationPath "dist\ClaudeUsageWidget-$v-portable.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Usage Widget ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/*.msi
            dist/*-portable.zip
            dist/SHA256SUMS.txt
