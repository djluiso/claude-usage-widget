name: CI & Release

# Every push and pull request runs the checks (format, lint, unit tests).
# A push to main whose Cargo.toml version has no GitHub Release yet then builds
# the installers and publishes that release automatically — so bumping
# `version` in Cargo.toml is how you ship. Other pushes are checked only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "release=false" >> $env:GITHUB_OUTPUT
            "::notice::v$v is already released - bump version in Cargo.toml to publish a new release."
          } else {
            "release=true" >> $env:GITHUB_OUTPUT
            "::notice::Releasing v$v"
          }
          exit 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.release == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.release == 'true'

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: cargo build --release --locked

      - name: Build setup.exe (Inno Setup)
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\setup.iss

      - name: Build .msi (WiX)
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build installer\widget.wxs -arch x64 -d "Version=${{ steps.version.outputs.version }}" `
            -o "dist\ClaudeUsageWidget-${{ steps.version.outputs.version }}.msi"
          Remove-Item dist\*.wixpdb -ErrorAction SilentlyContinue

      - name: Portable zip + checksums
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path target\release\claude-usage-widget.exe, README.md `
            -DestinationPath "dist\ClaudeUsageWidget-$v-portable.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Usage Widget ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*-setup.exe
            dist/*.msi
            dist/*-portable.zip
            dist/SHA256SUMS.txt
