[package]
name = "claude-usage-widget"
version = "1.4.0"
edition = "2021"
description = "Claude Code usage in real time: Windows taskbar, macOS menu bar, Linux tray"
repository = "https://github.com/djluiso/claude-usage-widget"
publish = false

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
foreign-types = "0.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_12"] }
ksni = { version = "0.3", features = ["blocking"] }

[build-dependencies]
winresource = "0.1"

# Linux .deb (built in CI with cargo-deb)
[package.metadata.deb]
name = "claude-usage-widget"
maintainer = "djluiso <djluiso@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """Shows Claude Code usage (tokens, the 5-hour window, cost estimates) in the system tray, with a detail drawer. Reads Claude Code's local transcripts; nothing leaves the machine."""
assets = [
    ["target/release/claude-usage-widget", "usr/bin/", "755"],
    ["installer/linux/claude-usage-widget.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/claude-usage-widget.png", "644"],
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
